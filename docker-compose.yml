version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=sqlite:///./globaladmit.db
      - SECRET_KEY=change-this-to-a-very-secure-random-key-in-prod
      - FRONTEND_URL=https://localhost
      - ADMIN_KEY=admin-secret-2024
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./backend/key.pem:/etc/nginx/certs/key.pem:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
